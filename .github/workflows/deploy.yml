name: Deploy to cPanel
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_kira_ai_cleanup:
        description: "Run the one-shot Kira AI dev-file cleanup job"
        type: boolean
        default: false

jobs:
  # NOTE: state-name is deliberately left unset on both jobs. The action resolves
  # it as "<local-dir><state-name>" and does not create missing parent folders, so
  # a value like ".github-state/x.json" fails with ENOENT. Each job has its own
  # local-dir and its own checkout, so the default flat state file
  # (.ftp-deploy-sync-state.json) cannot collide between jobs.
  deploy-theme:
    name: Deploy theme
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Sync theme files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp-content/themes/cyber-services/
        server-dir: ./wp-content/themes/cyber-services/

  deploy-kira-ai:
    name: Deploy Kira AI plugin
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # Only the in-house Kira AI plugin is synced here. No other plugin directory
    # is referenced, so nothing else under wp-content/plugins is touched.
    # server-dir intentionally keeps the "kira-ai 2" folder name because that is
    # the directory WordPress has activated on the host; deploying to a different
    # name would create a second copy of the plugin.
    # Dev-only files (tests, phpunit, composer, .DS_Store) are excluded so they
    # never land on the production server.
    - name: Sync Kira AI plugin files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp-content/plugins/kira-ai 2/
        server-dir: ./wp-content/plugins/kira-ai 2/
        # Paths are relative to local-dir, so root-level entries need a bare
        # pattern; "**/x/**" alone does not match "tests/..." at the top level.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          tests/**
          phpunit.xml.dist
          composer.json

  # One-shot, manual-only job. FTP-Deploy-Action applies `exclude` to both sides
  # of its diff, so files that were uploaded before the excludes existed are
  # never deleted by a later deploy. This job removes exactly those leftovers
  # (tests/, phpunit.xml.dist, composer.json, .DS_Store) from the plugin folder.
  # It is confined to wp-content/plugins/kira-ai 2 and never touches kira-ai.php.
  # Trigger it from Actions -> Run workflow -> tick the cleanup checkbox.
  cleanup-kira-ai-dev-files:
    name: Cleanup Kira AI dev files (one-shot)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_kira_ai_cleanup }}
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install basic-ftp
      run: npm install --no-save --silent basic-ftp@6

    - name: Verify plan (dry run)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        DRY_RUN: "1"
      run: node scripts/cleanup-kira-ai-dev-files.js

    - name: Remove leftover dev files
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: node scripts/cleanup-kira-ai-dev-files.js

